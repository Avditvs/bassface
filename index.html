<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Restrict what the page may load/execute: contains the blast radius of
       any future injection bug. soundcloud hosts + blob: (audio blobs) only. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://*.soundcloud.com https://*.sndcdn.com data:; media-src 'self' blob:; connect-src 'self' https://*.soundcloud.com https://*.sndcdn.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" />
  <title>Bassface — SoundCloud</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
