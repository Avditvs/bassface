<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Bassface — vinyl record with a smiling label -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- record -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#3a3a3a" stroke-width="14"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#333" stroke-width="6"/>

  <!-- label = face -->
  <circle cx="64" cy="64" r="17" fill="url(#g)"/>
  <circle cx="58" cy="60" r="2.6" fill="#1c1c1c"/>
  <circle cx="70" cy="60" r="2.6" fill="#1c1c1c"/>
  <path d="M57 69 Q 64 76 71 69" fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round"/>

  <!-- spindle -->
  <circle cx="64" cy="64" r="1.6" fill="#1c1c1c"/>
</svg>
