    <ellipse cx="103" cy="34" rx="4.5" ry="3.5" transform="rotate(-20 103 34)"/>
    <path d="M106.5 33 V 20" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M106.5 20 C 111 22 112 27 109 30 C 111 26 108 24 106.5 25" />
