<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 14 · Headphones, eyes closed in bliss (^ ^) — lost in the bass -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- head silhouette -->
  <circle cx="64" cy="68" r="42" fill="#2e2e2e"/>

  <!-- headphone band -->
  <path d="M20 70 C 20 40 40 22 64 22 C 88 22 108 40 108 70"
        fill="none" stroke="#f2f2f2" stroke-width="8" stroke-linecap="round"/>

  <!-- ear cups -->
  <rect x="12"  y="62" width="16" height="28" rx="8" fill="url(#g)"/>
  <rect x="100" y="62" width="16" height="28" rx="8" fill="url(#g)"/>

  <!-- blissful closed eyes: happy arcs -->
  <path d="M44 60 Q 50 54 56 60" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 60 Q 78 54 84 60" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>

  <!-- mountain waveform grin -->
  <g fill="url(#g)">
    <rect x="30" y="82" width="7" height="9"  rx="3.5"/>
    <rect x="41" y="76" width="7" height="15" rx="3.5"/>
    <rect x="52" y="72" width="7" height="19" rx="3.5"/>
    <rect x="63" y="70" width="7" height="21" rx="3.5"/>
    <rect x="74" y="72" width="7" height="19" rx="3.5"/>
    <rect x="85" y="76" width="7" height="15" rx="3.5"/>
  </g>
</svg>
