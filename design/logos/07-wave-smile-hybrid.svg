<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Bassface — hybrid: EQ-bar eyes + arc smile, maximal "face" read -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- eyes: short EQ bars -->
  <rect x="36" y="28" width="10" height="24" rx="5" fill="url(#g)"/>
  <rect x="82" y="28" width="10" height="24" rx="5" fill="url(#g)"/>

  <!-- mouth: bars along a smile arc, corners high / center low -->
  <g fill="url(#g)">
    <rect x="27"   y="66" width="10" height="14" rx="5"/>
    <rect x="43"   y="73" width="10" height="14" rx="5"/>
    <rect x="59"   y="76" width="10" height="14" rx="5"/>
    <rect x="75"   y="73" width="10" height="14" rx="5"/>
    <rect x="91"   y="66" width="10" height="14" rx="5"/>
  </g>

  <!-- corner dimples -->
  <rect x="16" y="56" width="7" height="9" rx="3.5" fill="url(#g)" transform="rotate(-35 19.5 60.5)"/>
  <rect x="105" y="56" width="7" height="9" rx="3.5" fill="url(#g)" transform="rotate(35 108.5 60.5)"/>
</svg>
