  <circle cx="78" cy="55" r="6.5" fill="#f2f2f2"/>
  <circle cx="52" cy="53" r="2" fill="#1c1c1c"/>
  <circle cx="80" cy="53" r="2" fill="#1c1c1c"/>

  <!-- wobble mouth: same asymmetric path as 19 -->
