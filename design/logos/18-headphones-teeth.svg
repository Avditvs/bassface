<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 18 · Headphones + gritted-teeth grin: that one drop at 0:58 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- head silhouette -->
  <circle cx="64" cy="68" r="42" fill="#2e2e2e"/>

  <!-- headphone band -->
  <path d="M20 70 C 20 40 40 22 64 22 C 88 22 108 40 108 70"
        fill="none" stroke="#f2f2f2" stroke-width="8" stroke-linecap="round"/>

  <!-- ear cups -->
  <rect x="12"  y="62" width="16" height="28" rx="8" fill="url(#g)"/>
  <rect x="100" y="62" width="16" height="28" rx="8" fill="url(#g)"/>

  <!-- squeezed-shut eyes -->
  <path d="M44 58 L 56 58" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 58 L 84 58" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>

  <!-- gritted teeth grin -->
  <rect x="38" y="78" width="52" height="16" rx="8" fill="#f2f2f2"/>
  <g stroke="#1c1c1c" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="79" x2="48" y2="93"/>
    <line x1="56" y1="79" x2="56" y2="93"/>
    <line x1="64" y1="79" x2="64" y2="93"/>
    <line x1="72" y1="79" x2="72" y2="93"/>
    <line x1="80" y1="79" x2="80" y2="93"/>
  </g>
</svg>
