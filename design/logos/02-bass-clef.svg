<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Bassface — bass clef (the dots are the "eyes") -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round">
    <!-- tail sweeping up-right -->
    <path d="M64 14 C 58 26 50 40 50 60"/>
    <!-- spiral body -->
    <path d="M50 60 C 50 80 62 92 78 92 C 92 92 102 83 102 71 C 102 60 94 52 83 52 C 73 52 66 59 66 68 C 66 76 72 81 80 81"/>
  </g>

  <!-- the two clef dots = eyes -->
  <circle cx="38" cy="34" r="6" fill="#ff5500"/>
  <circle cx="38" cy="94" r="6" fill="#ff5500"/>
</svg>
