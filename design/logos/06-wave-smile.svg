<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Bassface — waveform smile: bars follow a real smile arc, big eyes -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- eyes: large dots, instant "face" read -->
  <circle cx="44" cy="36" r="6.5" fill="#f2f2f2"/>
  <circle cx="84" cy="36" r="6.5" fill="#f2f2f2"/>

  <!-- mouth: vertical EQ bars whose positions follow a smile arc
       (corners high, center low) — still reads as a waveform -->
  <g fill="url(#g)">
    <rect x="25.5" y="58" width="9" height="16" rx="4.5"/>
    <rect x="42.5" y="65" width="9" height="16" rx="4.5"/>
    <rect x="59.5" y="68" width="9" height="16" rx="4.5"/>
    <rect x="76.5" y="65" width="9" height="16" rx="4.5"/>
    <rect x="93.5" y="58" width="9" height="16" rx="4.5"/>
  </g>

  <!-- corner "dimples": tiny bars turning up at the smile ends -->
  <rect x="14" y="50" width="7" height="10" rx="3.5" fill="url(#g)" transform="rotate(-30 17.5 55)"/>
  <rect x="107" y="50" width="7" height="10" rx="3.5" fill="url(#g)" transform="rotate(30 110.5 55)"/>
</svg>
