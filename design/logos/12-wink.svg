<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 12 · Wink: one eye open, one mid-blink -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- left eye open -->
  <circle cx="50" cy="36" r="7" fill="#f2f2f2"/>
  <circle cx="52" cy="34" r="2.2" fill="#1c1c1c"/>

  <!-- right eye winking (closed arc) -->
  <path d="M72 38 Q 78 32 84 38" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>

  <!-- mountain waveform mouth -->
  <g fill="url(#g)">
    <rect x="22" y="78" width="8" height="10" rx="4"/>
    <rect x="36" y="70" width="8" height="18" rx="4"/>
    <rect x="50" y="64" width="8" height="24" rx="4"/>
    <rect x="64" y="62" width="8" height="26" rx="4"/>
    <rect x="78" y="64" width="8" height="24" rx="4"/>
    <rect x="92" y="70" width="8" height="18" rx="4"/>
  </g>

  <!-- dimples -->
  <rect x="13" y="72" width="6" height="9" rx="3" fill="url(#g)" transform="rotate(-30 16 76.5)"/>
  <rect x="109" y="72" width="6" height="9" rx="3" fill="url(#g)" transform="rotate(30 112 76.5)"/>
</svg>
