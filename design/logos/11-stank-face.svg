<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 11 · Stank face: squinted eyes + tilted brows — the bass-drop grimace -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>

  <!-- tilted brows (inner ends down = approving scowl) -->
  <rect x="38" y="18" width="22" height="6" rx="3" fill="#f2f2f2" transform="rotate(-10 49 21)"/>
  <rect x="68" y="18" width="22" height="6" rx="3" fill="#f2f2f2" transform="rotate(10 79 21)"/>

  <!-- squinted eyes: short wide bars -->
  <rect x="40" y="34" width="18" height="8" rx="4" fill="#f2f2f2"/>
  <rect x="70" y="34" width="18" height="8" rx="4" fill="#f2f2f2"/>

  <!-- mountain waveform mouth, slightly asymmetric -->
  <g fill="url(#g)">
    <rect x="20" y="80" width="8" height="9"  rx="4"/>
    <rect x="33" y="74" width="8" height="15" rx="4"/>
    <rect x="46" y="70" width="8" height="19" rx="4"/>
    <rect x="59" y="66" width="8" height="23" rx="4"/>
    <rect x="72" y="68" width="8" height="21" rx="4"/>
    <rect x="85" y="72" width="8" height="17" rx="4"/>
    <rect x="98" y="78" width="8" height="11" rx="4"/>
  </g>
</svg>
